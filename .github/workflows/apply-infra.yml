name: Atualiza toda a infra do homelab

on:
  push:
    branches:
      - main

jobs: 
  instance-connection:
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
      - name: Check where I am
        run: ls


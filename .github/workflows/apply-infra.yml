name: Atualiza toda a infra do homelab

on:
  push:
    branches:
      - main

jobs: 
  instance-connection:
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
      
      - name: SSH
        run: |
          tailscale ssh andre@andrelab '
            set -euo pipefail
            cd ~/homelab && git fetch --all && git reset --hard origin/main
            cd infra
            terraform init -input=false
            terraform apply -auto-approve -input=false
          '

